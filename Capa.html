
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nosso Diário 3DS</title>

    <link rel="stylesheet" href="Capa.css">
    <script src="Capa.js" defer></script>
</head>
<body>

    <main class="livro">

        <!-- Página de entrada do diário -->
        <section class="pagina">

            <h1>Nosso Diário</h1>
            <p>Dois anos de histórias · Turma 3DS</p>

            <form id="formulario">

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome ou apelido"
                    autocomplete="name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Seu Gmail"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Entrar no diário</button>

            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>

            <!-- Acesso à página de cadastro -->
            <div class="opcao-cadastro">

                <p>Ainda não tem uma conta?</p>

                <a href="./Cadastro.html">
                    Criar minha conta ✦
                </a>

            </div>

        </section>

        <!-- Capa decorativa do diário -->
        <div class="capa" id="capa">

            <div class="frente">

                <div class="moldura"></div>

                <div class="decoracao superior">✦ ❦ ✦</div>

                <div class="titulo-capa">
                    <span>O LIVRO DAS</span>

                    <h2>Nossas Memórias</h2>

                    <div class="linha"></div>

                    <p>TURMA 3DS</p>
                </div>

                <div
                    class="cadeado"
                    id="cadeado"
                    role="button"
                    tabindex="0"
                    aria-label="Clique para abrir o diário"
                >
                    <div class="arco"></div>

                    <div class="corpo">
                        <div class="fechadura"></div>
                    </div>
                </div>

                <div class="decoracao inferior">❦</div>

                <div class="ano">2024 — 2026</div>

            </div>

        </div>

    </main>

</body>
</html>
