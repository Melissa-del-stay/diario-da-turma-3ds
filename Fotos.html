<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fotos | Nosso Diário 3DS</title>

    <link rel="stylesheet" href="Fotos.css">
    <script src="Fotos.js" defer></script>
</head>

<body>

    <main class="galeria">

        <nav class="postits" aria-label="Navegação do diário">
            <button class="postit inicio" type="button">Início</button>
            <button class="postit historia" type="button">História</button>
            <button class="postit fotos ativo" type="button">Fotos</button>
            <button class="postit figurinhas" type="button">Figurinhas</button>
            <button class="postit jogos" type="button">Jogos</button>
            <button class="postit album" type="button">Álbum de figurinhas</button>
            <button class="postit perfis" type="button">Perfis da turma</button>
        </nav>

        <button class="controle-lateral anterior" type="button">
            ←
        </button>

        <section class="livro">

            <header class="cabecalho">
                <span class="etiqueta">TURMA 3DS · 2024—2026</span>
                <h1>Nossas Memórias</h1>
                <div class="enfeite">✦ ❦ ✦</div>
                <p>Cada fotografia guarda um pedacinho da nossa história.</p>
            </header>

            <section class="grade-fotos" id="gradeFotos">
                <!-- Fotografias serão adicionadas pelo JavaScript -->
            </section>

        </section>

        <button class="controle-lateral proximo" type="button">
            →
        </button>

        <footer>
            FEITO DE MOMENTOS, GUARDADO PARA SEMPRE ✦
        </footer>

    </main>

</body>

</html>
